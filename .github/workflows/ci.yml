# Continuous checks. Runs on every push and pull request.
#
# This workflow deploys nothing and needs no secrets — it cannot reach AWS,
# production, or any credential. It exists so the gates that already protect this
# codebase actually run on every change instead of only when someone remembers:
#
#   * the business-facts copy gate (catches a non-zero host fee, "net after
#     fee", and unapproved claim shapes reappearing in customer-facing strings)
#   * the insurance language gate (house rule: insurance wording is founder
#     -reviewed, never derived)
#   * the server test suite
#   * env-reference drift: every variable the code reads must be documented in
#     .env.example, so the canonical reference cannot silently go stale

name: CI

on:
  push:
    branches-ignore:
      - develop # that branch has its own deploy workflow
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Canonical Bun version: 1.3.11. Must match the Dockerfile and the other
      # workflows — docs/BUN_AND_LOCKFILE.md is the single source of truth.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deterministic. If the lockfile cannot be consumed exactly as committed,
      # this fails hard rather than silently re-resolving — which is what the
      # old binary lockfile did on every production build.
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Bun version is the canonical one everywhere
        run: |
          CANON=1.3.11
          fail=0
          RUNNER=$(bun --version)
          [ "$RUNNER" = "$CANON" ] || { echo "::error::CI bun is $RUNNER, expected $CANON"; fail=1; }
          for f in Dockerfile .github/workflows/*.yml; do
            grep -oE 'oven/bun:[0-9]+\.[0-9]+\.[0-9]+|bun-version: *.[0-9]+\.[0-9]+\.[0-9]+.' "$f" 2>/dev/null \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | while read -r v; do
                  [ "$v" = "$CANON" ] || echo "::error file=$f::pins bun $v, expected $CANON"
                done
          done
          grep -qE 'oven/bun:[0-9.]+' Dockerfile && \
            [ "$(grep -oE 'oven/bun:[0-9.]+' Dockerfile | head -1 | cut -d: -f2)" = "$CANON" ] \
            || { echo "::error::Dockerfile does not pin bun $CANON"; fail=1; }
          [ -f bun.lock ] || { echo "::error::bun.lock (text lockfile) is missing"; fail=1; }
          [ -f bun.lockb ] && { echo "::error::bun.lockb still present — the binary lockfile was replaced by bun.lock"; fail=1; }
          exit $fail

      # Two runners, split by capability, together covering all 12 suites:
      #   jest    — everything except the two suites that transitively require
      #             sharetribe-flex-sdk, which is ESM-only and cannot be
      #             require()d under node
      #   bun     — those two. Production runs bun, whose ESM/CJS interop makes
      #             `require('sharetribe-flex-sdk')` work, which is why the
      #             server code itself is written that way
      - name: Server tests (jest)
        run: npx jest server --ci

      - name: Server tests requiring bun's ESM interop
        run: bun test server/api-util/currency.test.js server/api-util/lineItemHelpers.test.js

      # src/ is ESM with no babel config, so jest cannot load it; bun runs it
      # natively. This guards the search-integrity fix: an extended-data filter
      # the marketplace cannot apply must return nothing, never the full
      # catalogue (/s?pub_category=banana used to return all 124 listings).
      - name: Search param validation
        run: bun test src/containers/SearchPage/searchParamValidation.test.js

      # One place owns the Sharetribe credential aliasing (WEST vs EAST spellings).
      # Includes assertions that the diagnostic log line never contains a value.
      - name: Sharetribe credential resolution
        run: npx jest server/api-util/sharetribeCredentials.test.js --ci

      # Proof that the production image builds with FROZEN resolution. This is
      # the step that would have caught the old binary lockfile: bun 1.2.4 could
      # not parse it, so every production build silently re-resolved. Build only
      # — nothing is tagged, pushed or deployed.
      - name: Production image builds with a frozen lockfile
        run: |
          # The build stage needs .env.build (VITE_ public config). In CI there
          # are no secrets, so synthesise a minimal one: this proves the build
          # and the frozen install, not the values.
          cat > .env.build <<'ENVEOF'
          VITE_ENV=production
          VITE_MARKETPLACE_ROOT_URL=https://www.poolrentalnearme.com
          VITE_MARKETPLACE_NAME=Pool Rental Near Me
          VITE_SHARETRIBE_SDK_CLIENT_ID=00000000-0000-0000-0000-000000000000
          VITE_SHARETRIBE_USING_SSL=true
          VITE_STRIPE_PUBLISHABLE_KEY=pk_test_ci_build_only
          ENVEOF
          docker build --progress=plain -t prnm-ci-build-check . 2>&1 | tail -40
          echo "image built with --frozen-lockfile"
          rm -f .env.build

      - name: Image carries no secrets
        run: bash scripts/audit-image-secrets.sh prnm-ci-build-check

      - name: Insurance language gate
        run: bash scripts/check-insurance-language.sh

      - name: Workflows are valid YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  d = yaml.safe_load(open(f))
              except Exception as e:
                  print(f"::error file={f}::invalid YAML: {e}"); bad = 1; continue
              # `on:` parses to the boolean True in YAML 1.1 — accept either.
              if not (d.get('on') or d.get(True)):
                  print(f"::error file={f}::no trigger block"); bad = 1
              for name, job in (d.get('jobs') or {}).items():
                  if 'runs-on' not in job:
                      print(f"::error file={f}::job '{name}' has no runs-on"); bad = 1
          sys.exit(bad)
          PY

      - name: Every env variable the code reads is documented
        run: node scripts/check-env-documented.js
