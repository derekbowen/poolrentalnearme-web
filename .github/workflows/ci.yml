# Continuous checks. Runs on every push and pull request.
#
# This workflow deploys nothing and needs no secrets — it cannot reach AWS,
# production, or any credential. It exists so the gates that already protect this
# codebase actually run on every change instead of only when someone remembers:
#
#   * the business-facts copy gate (catches a non-zero host fee, "net after
#     fee", and unapproved claim shapes reappearing in customer-facing strings)
#   * the insurance language gate (house rule: insurance wording is founder
#     -reviewed, never derived)
#   * the server test suite
#   * env-reference drift: every variable the code reads must be documented in
#     .env.example, so the canonical reference cannot silently go stale

name: CI

on:
  push:
    branches-ignore:
      - develop # that branch has its own deploy workflow
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOT 1.2.4 (the version the Dockerfile pins). The committed bun.lockb is
      # binary format v0 written by a newer bun, and 1.2.4 cannot parse it —
      # `bun install --frozen-lockfile` fails with "outdated lockfile version".
      # See the version-drift warning step below: this is a real reproducibility
      # problem in the production build, not just a CI annoyance.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deliberately NOT --frozen-lockfile. It fails on the committed lockfile,
      # and the Dockerfile's plain `bun install` does not use the lockfile either
      # (1.2.4 cannot read it, so it silently re-resolves). Matching that
      # behaviour keeps CI honest about what production actually builds.
      - name: Install dependencies
        run: bun install

      - name: Warn about bun/lockfile version drift
        run: |
          DOCKER_BUN=$(grep -oE 'oven/bun:[0-9.]+' Dockerfile | head -1 | cut -d: -f2)
          CI_BUN=$(bun --version)
          echo "Dockerfile bun: $DOCKER_BUN"
          echo "CI bun:         $CI_BUN"
          if [ "$DOCKER_BUN" != "$CI_BUN" ]; then
            echo "::warning::Dockerfile pins bun $DOCKER_BUN but bun.lockb requires $CI_BUN to parse. Production builds re-resolve dependencies instead of using the lockfile, so they are not reproducible. Fix by aligning the Dockerfile's bun version with the lockfile, or regenerating the lockfile with $DOCKER_BUN — a deliberate decision, since it can change resolved versions."
          fi

      # Two runners, split by capability, together covering all 12 suites:
      #   jest    — everything except the two suites that transitively require
      #             sharetribe-flex-sdk, which is ESM-only and cannot be
      #             require()d under node
      #   bun     — those two. Production runs bun, whose ESM/CJS interop makes
      #             `require('sharetribe-flex-sdk')` work, which is why the
      #             server code itself is written that way
      - name: Server tests (jest)
        run: npx jest server --ci

      - name: Server tests requiring bun's ESM interop
        run: bun test server/api-util/currency.test.js server/api-util/lineItemHelpers.test.js

      - name: Insurance language gate
        run: bash scripts/check-insurance-language.sh

      - name: Workflows are valid YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  d = yaml.safe_load(open(f))
              except Exception as e:
                  print(f"::error file={f}::invalid YAML: {e}"); bad = 1; continue
              # `on:` parses to the boolean True in YAML 1.1 — accept either.
              if not (d.get('on') or d.get(True)):
                  print(f"::error file={f}::no trigger block"); bad = 1
              for name, job in (d.get('jobs') or {}).items():
                  if 'runs-on' not in job:
                      print(f"::error file={f}::job '{name}' has no runs-on"); bad = 1
          sys.exit(bad)
          PY

      - name: Every env variable the code reads is documented
        run: node scripts/check-env-documented.js
