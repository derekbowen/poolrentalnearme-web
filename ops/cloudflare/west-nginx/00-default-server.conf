# Explicit catch-all default server. Installed 2026-09-18 alongside the
# retirement of two obsolete vhosts. The chat proxy used to be the first
# "listen 443 ssl" and therefore the implicit default; removing it alone would
# have promoted the marketplace vhost to default for unmatched SNI.
# Unmatched Host / SNI / raw-IP must never reach the marketplace or EAST.
#
# Live: /etc/nginx/conf.d/00-default-server.conf on WEST
# (installed 2026-09-18 02:39:08Z, nginx -t ok, reload — master PID unchanged).
# Both IPv4 and IPv6 listeners are required: the marketplace block declares
# "listen [::]:443 ssl", so without the [::] lines the IPv6 default would still
# fall through to it.
#
# The self-signed cert is a throwaway (CN=invalid.invalid, /etc/nginx/reject-default/).
# nginx on WEST is 1.18.0, which predates ssl_reject_handshake; once nginx is
# >= 1.19.4 this block can drop the cert and use "ssl_reject_handshake on;".
#
# See docs/OPS_RECORD_2026-09-18_retire-update-and-chat-hosts.md
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 404;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Throwaway cert: nginx 1.18.0 predates ssl_reject_handshake.
    ssl_certificate     /etc/nginx/reject-default/reject.crt;
    ssl_certificate_key /etc/nginx/reject-default/reject.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log off;
    return 444;
}
