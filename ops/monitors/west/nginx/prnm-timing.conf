# 2026-09-16 diagnostic timing log (Derek GO, alert investigation 2026-09-15).
# Second access log only: nginx.conf's combined /var/log/nginx/access.log is untouched.
# Logs no cookies, no Authorization header, no request body. $request = method + URI + protocol.
log_format prnm_timing '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent '
                       'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time '
                       'urt=$upstream_response_time ua=$upstream_addr us=$upstream_status '
                       'host=$host "$http_user_agent"';
